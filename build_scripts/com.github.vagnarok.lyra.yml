app-id: com.github.vagnarok.lyra
branch: stable
runtime: org.kde.Platform
runtime-version: '6.7'
sdk: org.kde.Sdk
command: lyra

add-extensions:
  org.freedesktop.Platform.ffmpeg-full:
    directory: lib/ffmpeg
    version: '24.08'
    add-ld-path: .
    autodownload: true

finish-args:
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --share=ipc
  - --share=network
  - --filesystem=home
  - --talk-name=org.freedesktop.Notifications
  - --env=QT_QPA_PLATFORM=xcb

modules:
# ----------------------------------------------------------------------------
  # Modulo 0: Biblioteca de Segurança Kerberos (Exigida pelo PySide6 QtMultimedia)
  # ----------------------------------------------------------------------------
  - name: krb5
    subdir: src
    buildsystem: autotools
    sources:
      - type: archive
        url: https://kerberos.org/dist/krb5/1.21/krb5-1.21.2.tar.gz
        sha256: 9560941a9d843c0243a71b17a7ac6fe31c7cebb5bce3983db79e52ae7e850491

  # ----------------------------------------------------------------------------
  # Modulo 1: Dependências do Python (Instalação isolada dentro da Sandbox)
  # ----------------------------------------------------------------------------
  - name: python-dependencies
    buildsystem: simple
    build-options:
      build-args:
        - --share=network
    build-commands:
      - pip3 install --prefix=/app PySide6 yt-dlp python-mpv

  # ----------------------------------------------------------------------------
  # Modulo 2: FFmpeg Estático (Poder Total com NVENC, x264, x265, etc)
  # ----------------------------------------------------------------------------
  - name: ffmpeg-static
    buildsystem: simple
    build-options:
      build-args:
        - --share=network
    build-commands:
      - curl -L -o ffmpeg.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
      - tar -xf ffmpeg.tar.xz
      - cp ffmpeg-master-latest-linux64-gpl/bin/ffmpeg /app/bin/
      - cp ffmpeg-master-latest-linux64-gpl/bin/ffprobe /app/bin/
      - chmod +x /app/bin/ffmpeg /app/bin/ffprobe

# ----------------------------------------------------------------------------
  # Modulo 2.5: Compilação do libass (Dependência obrigatória do MPV)
  # ----------------------------------------------------------------------------
  - name: libass
    buildsystem: autotools
    sources:
      - type: archive
        url: https://github.com/libass/libass/releases/download/0.17.1/libass-0.17.1.tar.gz
        sha256: d653be97198a0543c69111122173c41a99e0b91426f9e17f06a858982c2fb03d

  # ----------------------------------------------------------------------------
  # Modulo 2.6: libXpresent (Dependência do MPV para X11 Rendering)
  # ----------------------------------------------------------------------------
  - name: libXpresent
    buildsystem: autotools
    sources:
      - type: archive
        url: https://xorg.freedesktop.org/releases/individual/lib/libXpresent-1.0.1.tar.gz
        sha256: 8ebf8567a8f6afe5a64275a2ecfd4c84e957970c27299d964350f60be9f3541d

  # ----------------------------------------------------------------------------
  # Modulo 2.7: libmpv (Motor de Áudio/Vídeo e Filtros LAVFI)
  # ----------------------------------------------------------------------------
  - name: libmpv
    buildsystem: meson
    config-opts:
      - -Dlibmpv=true
      - -Dcplayer=false
      - -Dalsa=disabled
      - -Dpulse=enabled
      - -Dgl=enabled
      - -Degl=enabled
      - -Dx11=enabled
      - -Dwayland=enabled
      - -Dlua=disabled
      - -Djavascript=disabled
      - -Duchardet=disabled
    sources:
      - type: archive
        url: https://github.com/mpv-player/mpv/archive/v0.35.1.tar.gz
        sha256: 41df981b7b84e33a2ef4478aaf81d6f4f5c8b9cd2c0d337ac142fc20b387d1a9

  # ----------------------------------------------------------------------------
  # Modulo 3: O Aplicativo Lyra-Qt (Isolamento de Código Ativo)
  # ----------------------------------------------------------------------------
  - name: lyra-app
    buildsystem: simple
    sources:
      - type: dir
        path: ..
    build-commands:
      # Criação da estrutura de pastas
      - mkdir -p /app/share/lyra
      - mkdir -p /app/bin
      - mkdir -p /app/share/applications
      - mkdir -p /app/share/icons/hicolor/scalable/apps
      
      # Cópia inteligente e recursiva de toda a arquitetura
      - cp main.py /app/share/lyra/
      - cp -r assets /app/share/lyra/
      - cp -r core /app/share/lyra/
      - cp -r gui /app/share/lyra/
      
      # Atalhos e Ícones
      - cp assets/icons/lyra.svg /app/share/icons/hicolor/scalable/apps/com.github.vagnarok.lyra.svg
      - |
        cat << EOF > /app/share/applications/com.github.vagnarok.lyra.desktop
        [Desktop Entry]
        Version=1.0
        Type=Application
        Name=Lyra Multimedia Converter
        Exec=lyra
        Icon=com.github.vagnarok.lyra
        Categories=AudioVideo;Utility;
        Terminal=false
        StartupWMClass=lyra-multimedia-converter
        EOF
      - |
        cat << 'EOF' > /app/bin/lyra
        #!/bin/sh
        exec python3 /app/share/lyra/main.py "$@"
        EOF
      - chmod +x /app/bin/lyra